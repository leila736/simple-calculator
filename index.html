<!DOCTYPE html>
<html>
<head>
  <title>جاوا اسکریپت (1)</title>
</head>
<body>
  <h1>ماشین حساب ساده</h1>
<!-- ورودی اول برای عدد -->
<input type="number" id="num1" placeholder="عدد اول" />

<!-- ورودی دوم برای عدد -->
<input type="number" id="num2" placeholder="عدد دوم" />

<!-- باکس انتخاب عمل‌ریاضی -->
<select id="operation">
  <option value="add">جمع</option>
  <option value="subtract">تفریق</option>
  <option value="multiply">ضرب</option>
  <option value="divide">تقسیم </option>
</select>

<!-- ورودی دوم برای عدد -->
<input type="number" id="num2" placeholder="عدد دوم" />

  

<!-- دکمه برای انجام عملیات -->
<button onclick="calculate()">محاسبه</button>

<!-- باکس برای نمایش نتیجه -->
<div>
  <h3>نتیجه: <span id="result">...</span></h3>
</div>
<!-- ورودی دوم برای عدد -->
<input type="number" id="num2" placeholder="عدد دوم" />

  

<!-- دکمه برای انجام عملیات -->
<button onclick="calculate()">محاسبه</button>

<!-- باکس برای نمایش نتیجه -->
<div>
  <h3>نتیجه: <span id="result">...</span></h3>
</div>
<script>
  function calculate() {
    // گرفتن مقادیر از ورودی‌ها
    const num1 = parseFloat(document.getElementById("num1").value);
    const num2 = parseFloat(document.getElementById("num2").value);
    const operation = document.getElementById("operation").value; // گرفتن عملیات انتخاب شده

    let result;

    // انتخاب عملیات بر اساس انتخاب کاربر
    if (operation === "add") {
      result = num1 + num2;
    } else if (operation === "subtract") {
      result = num1 - num2;
    } else if (operation === "multiply") {
      result = num1 * num2;
    } else if (operation === "divide") {
      if (num2 !== 0) {
        result = num1 / num2;
      } else {
        result = "تقسیم بر صفر امکان‌پذیر نیست!";
      }
    }

    // نمایش نتیجه در صفحه
    document.getElementById("result").textContent = result;
  }
</script>



</body>
</html>
